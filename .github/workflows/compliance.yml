name: compliance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # fetch-depth: 0 is load-bearing, not hardening: tools/validate.sh's
          # C8 check (NDS Sec 4 version-bump-vs-changelog) runs
          # `git show HEAD:<path>` for every shipped-doc file and treats a
          # failed lookup as "new file, skip comparison". GitHub Actions'
          # default shallow checkout would leave HEAD's history/object graph
          # incomplete on both the pull_request (merge-ref) and push (main)
          # trigger contexts, so full history is required here.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"

      - run: pip install -r .github/requirements-ci.txt

      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/generate_compliance_reference.py --check
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/test_compliance_reference.py
      - run: bash tools/validate.sh

  e2e_bootstrap:
    runs-on: ubicloud-standard-8
    steps:
      # No fetch-depth override here (unlike the validate job): the harness's
      # ephemeral tag is created locally on this checkout's own HEAD (a
      # commit object present regardless of clone depth), and bootstrap.sh's
      # own --depth 1 file:// self-clone from this checkout succeeds whether
      # the checkout itself is shallow or full (empirically verified at
      # contract-authoring time: a real shallow clone tagged on its own HEAD
      # still clones successfully via --depth 1 file://). GitHub Actions' own
      # default (a shallow, depth-1 checkout) applies.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"

      # jsonschema + pyyaml are required because, as of phase-006 feature 050,
      # the harness's assert_payload_validate_cwd_independent runs
      # `tools/validate.sh --payload` against the injected payload (proving
      # NDEBT-012 / issue #18 is fixed), and validate.sh fails closed on a
      # missing jsonschema/yaml module. Before F-050 the e2e exercised only
      # bootstrap.sh (which needs neither), so this step is new to this job.
      - run: pip install -r .github/requirements-ci.txt

      - run: bash tools/e2e_bootstrap_test.sh

  fixtures_self_test:
    runs-on: ubicloud-standard-8
    steps:
      # Workflow-assurance cases read pinned historical Git blobs and release
      # tags, so this job requires full history alongside working-tree fixtures.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"

      # tools/fixtures_self_test.sh (NDEBT-009, feature 052) drives
      # tools/validate.sh --target, which fails closed without jsonschema/yaml.
      - run: pip install -r .github/requirements-ci.txt


      - name: Record maintenance checkout source identity
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          paths = ['tools/fixtures_self_test.sh', 'tools/test_convergent_review.py', 'tools/validate.sh', 'standard/AGF.md', 'templates/AGENTS.md', 'tools/README.md', '.github/scripts/test_c13_cleanup.py', '.github/scripts/test_sandbox_boundaries.py', '.github/workflows/compliance.yml']
          print("MAINTENANCE_CHECKOUT_RECEIPT=" + json.dumps({"checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "source_sha256": {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}, sort_keys=True))
          PY
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_c13_cleanup.py
      - run: bash tools/fixtures_self_test.sh
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/test_workflow_assurance.py
      - name: Historical archive integrity and preservation deduplication
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tools/test_evidence_archive.py
          PYTHONDONTWRITEBYTECODE=1 python3 tools/test_evidence_preservation.py
          PYTHONDONTWRITEBYTECODE=1 python3 tools/test_canonical_formats.py
          PYTHONDONTWRITEBYTECODE=1 python3 tools/evidence_archive.py verify
      - name: Bound new generated evidence growth
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "${BASE}" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          PYTHONDONTWRITEBYTECODE=1 python3 tools/evidence_archive.py check-growth --base "${BASE}"

  convergent_review:
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"
      - run: pip install -r .github/requirements-ci.txt
      - name: Enable unprivileged user namespaces where the kernel restricts them
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Record maintenance checkout source identity
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          paths = ['tools/fixtures_self_test.sh', 'tools/test_convergent_review.py', 'tools/validate.sh', 'standard/AGF.md', 'templates/AGENTS.md', 'tools/README.md', '.github/scripts/test_c13_cleanup.py', '.github/scripts/test_sandbox_boundaries.py', '.github/workflows/compliance.yml']
          print("MAINTENANCE_CHECKOUT_RECEIPT=" + json.dumps({"checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "source_sha256": {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}, sort_keys=True))
          PY
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_sandbox_boundaries.py
      - name: Record capability runner environment
        run: |
          python3 - <<'PY'
          import json, os, platform
          keys = ['GITHUB_SHA', 'GITHUB_HEAD_REF', 'GITHUB_JOB', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_NAME', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion']
          print("CAPABILITY_RUNNER_RECEIPT=" + json.dumps({"host": platform.node(), "platform": platform.platform(), "environment": {key: os.environ.get(key) for key in keys}}, sort_keys=True))
          PY
      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
      - name: Check SBCL version
        run: sbcl --version
      - name: Check fresh SBCL without init files
        run: sbcl --no-sysinit --no-userinit --non-interactive --eval '(assert (= (+ 1 1) 2))'
      - name: Run required isolation suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/test_convergent_review.py
      - name: Pull pinned Docker trial-sandbox image
        run: docker pull "$(bash tools/docker_trial_sandbox.sh --print-image)"
      - name: Run Docker-adapter sandbox boundary suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_sandbox_boundaries.py --adapter tools/docker_trial_sandbox.sh
      - name: Run Docker-adapter required conformance suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/test_convergent_review.py --isolation-adapter tools/docker_trial_sandbox.sh

      - name: Select Root CI operation
        id: wa123
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, re
          source = pathlib.Path('tools/fixtures/workflow_assurance/wa123_selection.json')
          if source.exists():
              selected = json.loads(source.read_bytes())
              mode = selected['mode']
              producer = selected['producer']
              assert mode in ('capture', 'verify')
              assert producer['agent_id'] == 'wa123-capable-ci'
              assert re.fullmatch('123-ci-' + mode + '-attempt[1-3]', producer['session_id'])
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('mode=' + mode + '\n')
                  output.write('artifact=wa123-' + mode + '-' + producer['session_id'] + '\n')
          PYCODE
      - name: WA123 capture
        if: steps.wa123.outputs.mode == 'capture'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/workflow_assurance_ci.py capture --selection tools/fixtures/workflow_assurance/wa123_selection.json --output "$RUNNER_TEMP/wa123-capture"
      - name: WA123 verify
        if: steps.wa123.outputs.mode == 'verify'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/workflow_assurance_ci.py verify --selection tools/fixtures/workflow_assurance/wa123_selection.json --output "$RUNNER_TEMP/wa123-verify"
      - name: Preserve actual WA123 proof
        if: always() && steps.wa123.outputs.mode != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, official Root-observed pin
        with:
          name: ${{ steps.wa123.outputs.artifact }}
          path: ${{ runner.temp }}/wa123-${{ steps.wa123.outputs.mode }}/
          if-no-files-found: error
          archive: true

  self_governance:
    runs-on: ubicloud-standard-8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Exact fidelity reads blobs at the installed immutable release commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"
      - run: pip install -r .github/requirements-ci.txt
      - run: python3 .github/scripts/verify_self_governance.py
      - run: python3 .github/scripts/test_self_governance.py
      - run: bash .nizam/tools/validate.sh --payload
